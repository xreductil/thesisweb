<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台登入</title>
    <link rel="icon" type="image/webp" sizes="32x32" href="https://pub-0f1d8a52c1254c52a7ef1515ef60b41b.r2.dev/favicon.webp?v=20260721-3">
    <link rel="apple-touch-icon" href="https://pub-0f1d8a52c1254c52a7ef1515ef60b41b.r2.dev/apple-touch-icon.webp?v=20260721-3">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: #fff;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .login-box h1 {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 0.4rem;
        }
        .login-box p {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 2rem;
        }
        input[type="password"] {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 1rem;
        }
        input[type="password"]:focus { border-color: #4a90e2; }
        button {
            width: 100%;
            padding: 0.85rem;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #357abd; }
        .error-msg {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 0.8rem;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>後台管理</h1>
        <p>請輸入管理員密碼</p>
        <form onsubmit="event.preventDefault(); login()">
            <input type="password" id="password" placeholder="密碼" autofocus />
            <button type="submit">登入</button>
        </form>
        <p class="error-msg" id="errorMsg"></p>
    </div>
    <script>
        const API_BASE = "https://thesis-api.jinfeng8605.workers.dev";
        document.getElementById("password").addEventListener("keydown", e => {
            if (e.key === "Enter") login();
        });

        async function login() {
            const password = document.getElementById("password").value;
            const msg = document.getElementById("errorMsg");
            if (!password) { msg.textContent = "請輸入密碼"; return; }

            const res = await fetch(API_BASE + "/api/admin/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem("admin_token", data.token);
                window.location.href = "admin.html";
            } else {
                const data = await res.json().catch(() => ({}));
                msg.textContent = data.error || "登入失敗，請重新輸入";
                document.getElementById("password").value = "";
                document.getElementById("password").focus();
            }
        }
    </script>
</body>
</html>
